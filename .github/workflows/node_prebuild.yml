# Copyright 2010-2025 Google LLC
# Prebuilds and tests for @ortools-node/cp-sat.
#
# Note: Windows is not currently in the matrix. The MSVC + static-CRT +
# delay-load + bundled-protobuf chain has too many moving parts to keep
# green in a stable repo fork; track the long-term Windows effort in
# CONTRIBUTING.md. Linux x64/arm64 + macOS x64/arm64 are the supported
# platforms for v1.
name: Node prebuild

on:
  push:
    paths:
      - "ortools/sat/node/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - "ortools/sat/**"
      - ".github/workflows/node_prebuild.yml"
    branches:
      - "**"
  pull_request:
    paths:
      - "ortools/sat/node/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - "ortools/sat/**"
      - ".github/workflows/node_prebuild.yml"
  workflow_dispatch:

jobs:
  build:
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            triplet_dir: linux-x64
            triplet_file: node.napi.glibc.node
          - os: ubuntu-22.04-arm
            triplet_dir: linux-arm64
            triplet_file: node.napi.glibc.node
          # musl entries run inside node:20-alpine. The image ships
          # Node 20 + libstdc++; we apk-install the rest of the C++
          # toolchain in the first step. ubuntu-22.04-arm is real ARM64
          # hardware so the linux/arm64 Alpine variant runs natively.
          - os: ubuntu-22.04
            triplet_dir: linux-x64-musl
            triplet_file: node.napi.musl.node
            container: node:20-alpine
          - os: ubuntu-22.04-arm
            triplet_dir: linux-arm64-musl
            triplet_file: node.napi.musl.node
            container: node:20-alpine
          - os: macos-15-intel
            triplet_dir: darwin-x64
            triplet_file: node.napi.node
          - os: macos-14
            triplet_dir: darwin-arm64
            triplet_file: node.napi.node
    runs-on: ${{ matrix.os }}
    # Empty string when matrix.container is undefined → no container.
    container: ${{ matrix.container }}
    steps:
      # GitHub Actions refuses to run JS-based actions inside an Alpine
      # container on ARM64 hosts ("JavaScript Actions in Alpine
      # containers are only supported on x64 Linux runners"). The
      # laverdet/alpine-arm64 action ships a tweaked gcompat shim and
      # clears the Alpine marker in /etc/os-release so subsequent JS
      # actions (checkout, setup-node, upload-artifact) load correctly.
      # No-op on non-arm64 architectures and on non-Alpine containers.
      - name: Alpine ARM64 shim
        if: matrix.container != ''
        uses: laverdet/alpine-arm64@v1

      # actions/checkout's JS fallback works without git on PATH, which
      # matters because node:20-alpine doesn't bundle git. Subsequent
      # apk add later in the job pulls in everything else we need.
      - uses: actions/checkout@v4

      # node:20-alpine already provides Node 20; setup-node would try
      # to install glibc Node and fail. Skip it inside the container.
      - uses: actions/setup-node@v4
        if: matrix.container == ''
        with:
          node-version: "20"

      - name: Install build deps (Alpine)
        if: matrix.container != ''
        shell: sh
        run: |
          set -eu
          apk add --no-cache cmake ninja build-base linux-headers \
            git perl python3 bash
          # libstdc++ is preinstalled in node:20-alpine; the bundle
          # script in cmake/node.cmake picks it up from /usr/lib and
          # ships it inside the prebuild dir so consumers don't need
          # `apk add libstdc++` themselves.

      - name: Install Ninja
        if: matrix.container == ''
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then brew install ninja; fi
          if [[ "$RUNNER_OS" == "Linux" ]]; then sudo apt-get update && sudo apt-get install -y ninja-build; fi

      - name: Configure CMake
        shell: bash
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_CXX=ON -DBUILD_DEPS=ON -DBUILD_NODE=ON \
            -DBUILD_SAMPLES=OFF -DBUILD_EXAMPLES=OFF -DBUILD_TESTING=OFF \
            -DUSE_SCIP=OFF -DUSE_HIGHS=OFF -DUSE_COINOR=OFF

      - name: Build native addon
        shell: bash
        run: cmake --build build --target ortools_cpsat_node --config Release

      - name: Verify single exported symbol (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -e
          out=ortools/sat/node/prebuilds/${{ matrix.triplet_dir }}/${{ matrix.triplet_file }}
          ls -la "$out"
          nm -D --defined-only "$out" | awk '$2 == "T" {print $3}' | sort > /tmp/exports
          cat /tmp/exports
          echo "napi_register_module_v1" > /tmp/expected
          diff /tmp/expected /tmp/exports

      - name: Build TS
        working-directory: ortools/sat/node
        shell: bash
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build

      - name: Run tests
        working-directory: ortools/sat/node
        shell: bash
        run: npm test

      - name: Upload prebuild bundle
        uses: actions/upload-artifact@v4
        with:
          name: prebuild-${{ matrix.triplet_dir }}
          # Each prebuild is a directory: the .node + the bundled runtime
          # shared libraries (libortools, libabsl_*, libprotobuf, ...).
          # That whole directory is what the per-platform tarball ships
          # under `@ortools-node/cp-sat-<plat>-<arch>/`.
          path: ortools/sat/node/prebuilds/${{ matrix.triplet_dir }}/

      # ----- Per-runner packaging dry-run -----
      # Build the matching @ortools-node/cp-sat-<plat>-<arch> staging dir
      # from the just-built prebuild, npm pack both the slim main and the
      # platform package, sanity-check tarball contents, then npm install
      # the pair into a scratch dir and run scripts/smoke.mjs end-to-end.
      # This rehearses on every PR exactly what consumers will experience
      # when they `npm install @ortools-node/cp-sat`, on the same OS/arch
      # the binary was built for.
      - name: Build platform package staging dir
        working-directory: ortools/sat/node
        shell: bash
        run: node scripts/build-platform-packages.mjs

      - name: Pack main + matching platform tarball
        id: pack
        working-directory: ortools/sat/node
        shell: bash
        run: |
          set -e
          mkdir -p _tarballs
          main_tarball=$(npm pack 2>/dev/null | tail -n1)
          mv "$main_tarball" _tarballs/
          plat_tarball=$(cd _platform-packages/cp-sat-${{ matrix.triplet_dir }} && npm pack 2>/dev/null | tail -n1)
          mv "_platform-packages/cp-sat-${{ matrix.triplet_dir }}/$plat_tarball" _tarballs/
          ls -la _tarballs/
          # Outputs are GITHUB_WORKSPACE-relative so downstream steps with
          # different working-directory can reach them via $GITHUB_WORKSPACE.
          main=$(ls _tarballs/ortools-node-cp-sat-*.tgz | grep -Ev 'cp-sat-(linux|darwin|win32)-')
          plat=$(ls _tarballs/ortools-node-cp-sat-${{ matrix.triplet_dir }}-*.tgz)
          echo "main=ortools/sat/node/$main" >> "$GITHUB_OUTPUT"
          echo "plat=ortools/sat/node/$plat" >> "$GITHUB_OUTPUT"

      - name: Verify tarball contents
        working-directory: ortools/sat/node
        shell: bash
        run: |
          set -e
          # The pack step's outputs are GITHUB_WORKSPACE-relative so they
          # round-trip through other working-directory steps; resolve them
          # against $GITHUB_WORKSPACE here.
          main="$GITHUB_WORKSPACE/${{ steps.pack.outputs.main }}"
          plat="$GITHUB_WORKSPACE/${{ steps.pack.outputs.plat }}"
          # Materialize listings once. GitHub Actions bash runs with
          # `set -eo pipefail`, so piping `tar -tf` directly into `grep -q`
          # causes a SIGPIPE on tar that fails the pipeline; dumping to a
          # file sidesteps that and is faster too.
          tar -tf "$main" > /tmp/main_files.txt
          tar -tf "$plat" > /tmp/plat_files.txt
          # Main tarball must NOT contain any prebuilds/ — that's the whole
          # point of the slim main package.
          if grep -q '^package/prebuilds/' /tmp/main_files.txt; then
            echo "ERROR: main tarball contains prebuilds/" >&2
            grep '^package/prebuilds/' /tmp/main_files.txt >&2
            exit 1
          fi
          # Required main-package payload.
          for required in package/dist/index.js package/src/cpp/binding.cc package/version.lds; do
            grep -qxF "$required" /tmp/main_files.txt || {
              echo "ERROR: main tarball missing $required" >&2; exit 1; }
          done
          # Main must declare optionalDependencies for all 6 platform packages.
          tar -xOf "$main" package/package.json > /tmp/main_pjson.json
          node -e "
            const p = JSON.parse(require('fs').readFileSync('/tmp/main_pjson.json','utf8'));
            const want = [
              'linux-x64', 'linux-arm64',
              'linux-x64-musl', 'linux-arm64-musl',
              'darwin-x64', 'darwin-arm64',
            ];
            const errs = [];
            for (const w of want) {
              const k = '@ortools-node/cp-sat-' + w;
              if (!p.optionalDependencies || !p.optionalDependencies[k]) {
                errs.push('missing optionalDependency: ' + k);
              }
            }
            if (errs.length) { console.error(errs.join('\n')); process.exit(1); }
          "
          # Platform tarball must contain cp-sat.node and a coherent package.json.
          grep -qxF 'package/cp-sat.node' /tmp/plat_files.txt || {
            echo "ERROR: platform tarball missing cp-sat.node" >&2; exit 1; }
          tar -xOf "$plat" package/package.json > /tmp/plat_pjson.json
          TRIPLET="${{ matrix.triplet_dir }}" node -e "
            const p = JSON.parse(require('fs').readFileSync('/tmp/plat_pjson.json','utf8'));
            const main = JSON.parse(require('fs').readFileSync('package.json','utf8'));
            const triplet = process.env.TRIPLET;
            const expectName = '@ortools-node/cp-sat-' + triplet;
            const errs = [];
            if (p.name !== expectName) errs.push('name mismatch: ' + p.name + ' vs ' + expectName);
            if (p.version !== main.version) errs.push('version mismatch: ' + p.version + ' vs ' + main.version);
            if (p.main !== './cp-sat.node') errs.push('main mismatch: ' + p.main);
            if (!Array.isArray(p.os) || p.os.length !== 1) errs.push('os mismatch');
            if (!Array.isArray(p.cpu) || p.cpu.length !== 1) errs.push('cpu mismatch');
            if (triplet.endsWith('-musl')) {
              if (!Array.isArray(p.libc) || !p.libc.includes('musl')) errs.push('musl package libc must be [musl]');
            } else if (triplet.startsWith('linux-')) {
              if (!Array.isArray(p.libc) || !p.libc.includes('glibc')) errs.push('glibc Linux package libc must be [glibc]');
            } else {
              if (p.libc) errs.push('non-linux package should not declare libc');
            }
            if (errs.length) { console.error(errs.join('\n')); process.exit(1); }
          "
          echo "tarball contents OK"

      - name: End-to-end install smoke test
        shell: bash
        run: |
          set -e
          mkdir -p /tmp/install-test
          cd /tmp/install-test
          npm init -y >/dev/null
          npm pkg set type=module
          # Install main + the runner's matching platform tarball. The
          # other 3 platform tarballs aren't on disk; npm will warn that
          # some optional deps couldn't be resolved (same UX as a real
          # cross-OS install).
          npm install --no-audit --no-fund \
            "$GITHUB_WORKSPACE/${{ steps.pack.outputs.main }}" \
            "$GITHUB_WORKSPACE/${{ steps.pack.outputs.plat }}"
          cp "$GITHUB_WORKSPACE/ortools/sat/node/scripts/smoke.mjs" smoke.mjs
          node smoke.mjs

      - name: Upload PR tarballs (per-runner)
        uses: actions/upload-artifact@v4
        with:
          name: pr-tarballs-${{ matrix.triplet_dir }}
          path: ortools/sat/node/_tarballs/

  # Mirrors the release workflow's pack job: download all 4 prebuilds,
  # rebuild TS, run scripts/build-platform-packages.mjs, and pack all 5
  # tarballs at once. Catches "release pipeline can't produce all 5"
  # regressions without having to cut a tag.
  pack-dry-run:
    name: Pack-all dry run
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Download all prebuilds
        uses: actions/download-artifact@v4
        with:
          pattern: prebuild-*
          path: ortools/sat/node/_prebuilds_flat

      - name: Reassemble prebuilds/
        working-directory: ortools/sat/node
        shell: bash
        run: |
          set -e
          mkdir -p prebuilds
          for d in _prebuilds_flat/prebuild-*; do
            triplet="${d#_prebuilds_flat/prebuild-}"
            mkdir -p "prebuilds/$triplet"
            mv "$d"/* "prebuilds/$triplet/"
          done
          rm -rf _prebuilds_flat
          du -sh prebuilds/*/

      - name: Build TS
        working-directory: ortools/sat/node
        shell: bash
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build

      - name: Build platform packages
        working-directory: ortools/sat/node
        shell: bash
        run: node scripts/build-platform-packages.mjs

      - name: Pack everything
        working-directory: ortools/sat/node
        shell: bash
        run: |
          set -e
          mkdir -p _tarballs
          mv "$(npm pack 2>/dev/null | tail -n1)" _tarballs/
          for d in _platform-packages/*/; do
            tar=$(cd "$d" && npm pack 2>/dev/null | tail -n1)
            mv "$d/$tar" _tarballs/
          done
          ls -la _tarballs/
          # Exactly 7 tarballs (1 main + 6 platforms: linux-x64,
          # linux-arm64, linux-x64-musl, linux-arm64-musl, darwin-x64,
          # darwin-arm64) at one version.
          count=$(ls _tarballs/*.tgz | wc -l)
          if [[ "$count" != "7" ]]; then
            echo "ERROR: expected 7 tarballs, got $count" >&2
            exit 1
          fi
          version=$(node -p "require('./package.json').version")
          for t in _tarballs/*.tgz; do
            [[ "$t" == *"-$version.tgz" ]] || {
              echo "ERROR: $t does not match version $version" >&2; exit 1; }
          done

      - name: Upload aggregated PR tarballs
        uses: actions/upload-artifact@v4
        with:
          name: pr-tarballs-all
          path: ortools/sat/node/_tarballs/
