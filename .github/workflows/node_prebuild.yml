# Prebuilds and tests for @google-ortools/cp-sat.
name: Node prebuild

on:
  push:
    tags:
      - "node-v*"
  pull_request:
    paths:
      - "ortools/node/**"
      - "cmake/node.cmake"
      - "ortools/sat/**"
      - ".github/workflows/node_prebuild.yml"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            triplet: linux-x64-glibc
          - os: ubuntu-22.04-arm
            triplet: linux-arm64-glibc
          - os: macos-13
            triplet: darwin-x64
          - os: macos-14
            triplet: darwin-arm64
          - os: windows-2022
            triplet: win32-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Ninja (Unix)
        if: runner.os != 'Windows'
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then brew install ninja; fi
          if [[ "$RUNNER_OS" == "Linux" ]]; then sudo apt-get update && sudo apt-get install -y ninja-build; fi
        shell: bash
      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y
        shell: pwsh

      - name: Configure CMake
        shell: bash
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_CXX=ON -DBUILD_DEPS=ON -DBUILD_NODE=ON \
            -DBUILD_SAMPLES=OFF -DBUILD_EXAMPLES=OFF -DBUILD_TESTING=OFF \
            -DUSE_SCIP=OFF -DUSE_HIGHS=OFF -DUSE_COINOR=OFF

      - name: Build native addon
        run: cmake --build build --target ortools_cpsat_node --config Release
        shell: bash

      - name: Verify single exported symbol (Linux)
        if: runner.os == 'Linux'
        run: |
          nm -D --defined-only ortools/node/prebuilds/${{ matrix.triplet }}/ortools_cpsat_node.node \
            | awk '$2 == "T" {print $3}' | sort > /tmp/exports
          cat /tmp/exports
          echo "napi_register_module_v1" > /tmp/expected
          diff /tmp/expected /tmp/exports

      - name: Package .node as node.napi.node
        shell: bash
        run: |
          cp ortools/node/prebuilds/${{ matrix.triplet }}/ortools_cpsat_node.node \
             ortools/node/prebuilds/${{ matrix.triplet }}/node.napi.node

      - name: Build TS
        working-directory: ortools/node
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Run tests
        working-directory: ortools/node
        run: npm test

      - name: Upload prebuild
        uses: actions/upload-artifact@v4
        with:
          name: prebuild-${{ matrix.triplet }}
          path: ortools/node/prebuilds/${{ matrix.triplet }}/node.napi.node

  pack:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/node-v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - uses: actions/download-artifact@v4
        with:
          pattern: prebuild-*
          path: ortools/node/prebuilds
          merge-multiple: true
      - name: Build TS
        working-directory: ortools/node
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: Pack
        working-directory: ortools/node
        run: npm pack
      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: ortools/node/*.tgz
