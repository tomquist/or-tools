# Prebuilds and tests for @ortools-node/cp-sat.
name: Node prebuild

on:
  push:
    paths:
      - "ortools/sat/node/**"
      - "cmake/node.cmake"
      - "ortools/sat/**"
      - ".github/workflows/node_prebuild.yml"
    branches:
      - "**"
  pull_request:
    paths:
      - "ortools/sat/node/**"
      - "cmake/node.cmake"
      - "ortools/sat/**"
      - ".github/workflows/node_prebuild.yml"
  workflow_dispatch:

jobs:
  build:
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            triplet_dir: linux-x64
            triplet_file: node.napi.glibc.node
          - os: ubuntu-22.04-arm
            triplet_dir: linux-arm64
            triplet_file: node.napi.glibc.node
          - os: macos-15-intel
            triplet_dir: darwin-x64
            triplet_file: node.napi.node
          - os: macos-14
            triplet_dir: darwin-arm64
            triplet_file: node.napi.node
          - os: windows-2022
            triplet_dir: win32-x64
            triplet_file: node.napi.node
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Ninja (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then brew install ninja; fi
          if [[ "$RUNNER_OS" == "Linux" ]]; then sudo apt-get update && sudo apt-get install -y ninja-build; fi
      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ninja -y

      - name: Configure CMake
        shell: bash
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_CXX=ON -DBUILD_DEPS=ON -DBUILD_NODE=ON \
            -DBUILD_SAMPLES=OFF -DBUILD_EXAMPLES=OFF -DBUILD_TESTING=OFF \
            -DUSE_SCIP=OFF -DUSE_HIGHS=OFF -DUSE_COINOR=OFF

      - name: Build native addon
        shell: bash
        run: cmake --build build --target ortools_cpsat_node --config Release

      - name: Verify single exported symbol (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -e
          out=ortools/sat/node/prebuilds/${{ matrix.triplet_dir }}/${{ matrix.triplet_file }}
          ls -la "$out"
          nm -D --defined-only "$out" | awk '$2 == "T" {print $3}' | sort > /tmp/exports
          cat /tmp/exports
          echo "napi_register_module_v1" > /tmp/expected
          diff /tmp/expected /tmp/exports

      - name: Build TS
        working-directory: ortools/sat/node
        shell: bash
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build

      - name: Run tests
        working-directory: ortools/sat/node
        shell: bash
        run: npm test

      - name: Upload prebuild bundle
        uses: actions/upload-artifact@v4
        with:
          name: prebuild-${{ matrix.triplet_dir }}
          # Each prebuild is now a directory: the .node + the bundled
          # runtime shared libraries (libortools, libabsl_*, libprotobuf,
          # ...). The bundle is what npm pack ships under
          # `prebuilds/<triplet>/`.
          path: ortools/sat/node/prebuilds/${{ matrix.triplet_dir }}/
