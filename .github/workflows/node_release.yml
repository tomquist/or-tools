# Copyright 2010-2025 Google LLC
# Tag-driven release for @ortools-node/cp-sat.
#
# Trigger: pushing a tag that matches `cp-sat-v*`. The workflow:
#   1. Builds the prebuild matrix (linux x64/arm64, macOS x64/arm64).
#      Windows is intentionally not in the matrix; see CONTRIBUTING.md.
#   2. Aggregates the prebuilt .node + bundled runtime libs into
#      ortools/sat/node/prebuilds/.
#   3. Assembles four per-platform packages
#      (@ortools-node/cp-sat-<plat>-<arch>) plus the slim main package
#      (@ortools-node/cp-sat) — five tarballs total.
#   4. Uploads the tarballs as a build artifact and as GitHub release assets.
#   5. Publishes to npm via Trusted Publishing (OIDC), gated behind the
#      `npm-publish` environment so a maintainer must approve the publish
#      step before the packages are pushed live. Platform packages are
#      published first so they're resolvable by the time the main
#      package's optionalDependencies fire. Pre-release versions are
#      tagged as `next` on npm.
#
# To cut a release:
#   1. Bump the version in ortools/sat/node/package.json (this also
#      updates the optionalDependencies and the platform packages'
#      version, which is read from package.json at pack time).
#   2. Update ortools/sat/node/CHANGELOG.md.
#   3. Commit, tag with `cp-sat-vX.Y.Z[-suffix]`, push the tag.
#   4. Approve the publish step in the GitHub Actions UI.

name: Node release

on:
  push:
    tags:
      - "cp-sat-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Override version (e.g. 9.15.0-node.1). Leave blank to use package.json."
        required: false

jobs:
  build:
    name: Prebuild ${{ matrix.triplet_dir }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            triplet_dir: linux-x64
            triplet_file: node.napi.glibc.node
          - os: ubuntu-22.04-arm
            triplet_dir: linux-arm64
            triplet_file: node.napi.glibc.node
          # musl entries run inside node:20-alpine. The image ships
          # Node 20 + libstdc++; we apk-install the rest of the C++
          # toolchain in the first step.
          - os: ubuntu-22.04
            triplet_dir: linux-x64-musl
            triplet_file: node.napi.musl.node
            container: node:20-alpine
          - os: ubuntu-22.04-arm
            triplet_dir: linux-arm64-musl
            triplet_file: node.napi.musl.node
            container: node:20-alpine
          - os: macos-15-intel
            triplet_dir: darwin-x64
            triplet_file: node.napi.node
          - os: macos-14
            triplet_dir: darwin-arm64
            triplet_file: node.napi.node
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      # GH Actions refuses to run JS-based actions inside an Alpine
      # container on ARM64 hosts. laverdet/alpine-arm64 ships a tweaked
      # gcompat + clears the Alpine marker so subsequent JS actions
      # work. No-op on non-arm64 architectures.
      - name: Alpine ARM64 shim
        if: matrix.container != ''
        uses: laverdet/alpine-arm64@v1

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: matrix.container == ''
        with:
          node-version: "20"

      - name: Install build deps (Alpine)
        if: matrix.container != ''
        shell: sh
        run: |
          set -eu
          apk add --no-cache cmake ninja build-base linux-headers \
            git perl python3 bash

      - name: Install Ninja
        if: matrix.container == ''
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then brew install ninja; fi
          if [[ "$RUNNER_OS" == "Linux" ]]; then sudo apt-get update && sudo apt-get install -y ninja-build; fi

      - name: Configure CMake
        shell: bash
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_CXX=ON -DBUILD_DEPS=ON -DBUILD_NODE=ON \
            -DBUILD_SAMPLES=OFF -DBUILD_EXAMPLES=OFF -DBUILD_TESTING=OFF \
            -DUSE_SCIP=OFF -DUSE_HIGHS=OFF -DUSE_COINOR=OFF

      - name: Build native addon
        shell: bash
        run: cmake --build build --target ortools_cpsat_node --config Release

      - name: Verify single exported symbol (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -e
          out=ortools/sat/node/prebuilds/${{ matrix.triplet_dir }}/${{ matrix.triplet_file }}
          ls -la "$out"
          nm -D --defined-only "$out" | awk '$2 == "T" {print $3}' | sort > /tmp/exports
          cat /tmp/exports
          echo "napi_register_module_v1" > /tmp/expected
          diff /tmp/expected /tmp/exports

      - name: Build TS
        working-directory: ortools/sat/node
        shell: bash
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build

      - name: Run tests
        working-directory: ortools/sat/node
        shell: bash
        run: npm test

      - name: Upload prebuild bundle
        uses: actions/upload-artifact@v4
        with:
          name: prebuild-${{ matrix.triplet_dir }}
          path: ortools/sat/node/prebuilds/${{ matrix.triplet_dir }}/

  pack:
    name: Pack tarballs
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.pack.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Download all prebuilds
        uses: actions/download-artifact@v4
        with:
          pattern: prebuild-*
          path: ortools/sat/node/_prebuilds_flat

      # Each prebuild artifact unpacks as
      # `_prebuilds_flat/prebuild-<dir>/<files...>` (the .node and its
      # bundled runtime shared libs). Move each directory into
      # `prebuilds/<dir>/` to match the layout node-gyp-build expects.
      - name: Reassemble prebuilds/
        shell: bash
        run: |
          set -e
          cd ortools/sat/node
          mkdir -p prebuilds
          for d in _prebuilds_flat/prebuild-*; do
            triplet="${d#_prebuilds_flat/prebuild-}"
            mkdir -p "prebuilds/$triplet"
            mv "$d"/* "prebuilds/$triplet/"
          done
          rm -rf _prebuilds_flat
          du -sh prebuilds/*/

      - name: Override version (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        working-directory: ortools/sat/node
        shell: bash
        run: npm version "${{ inputs.version }}" --no-git-tag-version --allow-same-version

      - name: Build TS
        working-directory: ortools/sat/node
        shell: bash
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build

      - name: Build platform packages
        working-directory: ortools/sat/node
        shell: bash
        run: node scripts/build-platform-packages.mjs

      - name: Pack main + platform tarballs
        id: pack
        working-directory: ortools/sat/node
        shell: bash
        run: |
          set -e
          mkdir -p _tarballs
          # Main slim package (no prebuilds/, just dist/ + src/cpp/ + version.lds).
          main_tarball=$(npm pack 2>/dev/null | tail -n1)
          mv "$main_tarball" _tarballs/
          # Platform packages.
          for d in _platform-packages/*/; do
            tar=$(cd "$d" && npm pack 2>/dev/null | tail -n1)
            mv "$d/$tar" _tarballs/
          done
          ls -la _tarballs/
          # Sanity: exactly 7 tarballs (1 main + 6 platforms: linux-x64,
          # linux-arm64, linux-x64-musl, linux-arm64-musl, darwin-x64,
          # darwin-arm64) at one version.
          count=$(ls _tarballs/*.tgz | wc -l)
          if [[ "$count" != "7" ]]; then
            echo "ERROR: expected 7 tarballs, got $count" >&2
            exit 1
          fi
          version=$(node -p "require('./package.json').version")
          for t in _tarballs/*.tgz; do
            [[ "$t" == *"-$version.tgz" ]] || {
              echo "ERROR: $t does not match version $version" >&2; exit 1; }
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Upload tarballs artifact
        uses: actions/upload-artifact@v4
        with:
          name: npm-tarballs
          path: ortools/sat/node/_tarballs/

      - name: Attach to GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/cp-sat-v')
        uses: softprops/action-gh-release@v2
        with:
          files: ortools/sat/node/_tarballs/*.tgz
          generate_release_notes: true

  publish:
    name: Publish to npm
    needs: pack
    runs-on: ubuntu-latest
    # The `npm-publish` environment must be configured in the repo settings
    # with required reviewers. This gates the publish step behind a manual
    # approval click. Authentication uses Trusted Publishing (OIDC) -- no
    # NPM_TOKEN secret is needed.
    environment:
      name: npm-publish
      url: https://www.npmjs.com/package/@ortools-node/cp-sat
    permissions:
      contents: read
      id-token: write   # OIDC for npm Trusted Publishing
    steps:
      # Note: `registry-url:` is intentionally NOT set here. With it,
      # actions/setup-node@v4 writes an `.npmrc` containing
      #   //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
      # and defaults NODE_AUTH_TOKEN to the placeholder
      # `XXXXX-XXXXX-XXXXX-XXXXX`. `npm publish` then sends that bogus
      # bearer token instead of falling back to OIDC, and the registry
      # responds with 404 ("not in this registry") — npm's standard
      # message for an unauthorized publish to a scope/name. Omitting
      # registry-url leaves no `_authToken` in the npm config, which
      # is what npm 11.5.1+'s Trusted Publishing flow requires.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Trusted Publishing needs npm >= 11.5.1; Node 22 ships with npm 10.x
      - name: Upgrade npm
        run: npm install -g npm@latest

      # We need scripts/smoke.mjs from the repo to drive the install
      # smoke test. Checking out is cheaper than re-uploading the
      # script as an artifact.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: npm-tarballs
          path: _tarballs

      - name: Identify tarballs
        id: tarballs
        shell: bash
        run: |
          set -e
          # Main tarball: ortools-node-cp-sat-<version>.tgz (no plat suffix).
          # Platform tarballs: ortools-node-cp-sat-<plat>-<arch>-<version>.tgz.
          main=$(ls _tarballs/ortools-node-cp-sat-*.tgz | grep -Ev 'cp-sat-(linux|darwin|win32)-')
          echo "main=$main" >> "$GITHUB_OUTPUT"
          # The publish runner is linux-x64, so that's the platform tarball
          # we install + smoke-test against.
          plat=$(ls _tarballs/ortools-node-cp-sat-linux-x64-*.tgz)
          echo "plat=$plat" >> "$GITHUB_OUTPUT"
          version=$(tar -xOf "$main" package/package.json | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify tarball loads
        shell: bash
        run: |
          set -e
          mkdir -p /tmp/install-test
          cd /tmp/install-test
          npm init -y >/dev/null
          npm pkg set type=module
          # Install main + matching platform tarball directly. The other
          # 3 platform optionalDependencies aren't on disk; npm will warn
          # and skip them, which is the same behaviour real users on
          # mismatched OS/arch see.
          npm install --no-audit --no-fund \
            "$GITHUB_WORKSPACE/${{ steps.tarballs.outputs.main }}" \
            "$GITHUB_WORKSPACE/${{ steps.tarballs.outputs.plat }}"
          cp "$GITHUB_WORKSPACE/ortools/sat/node/scripts/smoke.mjs" smoke.mjs
          node smoke.mjs

      - name: Determine npm dist-tag
        id: dist-tag
        shell: bash
        run: |
          if [[ "${{ steps.tarballs.outputs.version }}" == *-* ]]; then
            echo "tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: npm publish
        shell: bash
        run: |
          set -e
          tag="${{ steps.dist-tag.outputs.tag }}"
          # `--provenance` opts in to npm provenance attestations, which
          # are signed by the OIDC token's issuer (Sigstore) and bind
          # the published tarball to this exact workflow run. Required
          # for the Trusted Publishing-issued tokens to be honored on
          # newer npm versions and visible as the green "Provenance"
          # badge on the npmjs.com package page.
          #
          # Platform packages are published first so the main package's
          # optionalDependencies are immediately resolvable for any
          # consumer that installs the main package right after publish.
          for plat in linux-x64 linux-arm64 linux-x64-musl linux-arm64-musl darwin-x64 darwin-arm64; do
            tarball=$(ls _tarballs/ortools-node-cp-sat-${plat}-*.tgz)
            echo "==> publishing $tarball (tag=$tag)"
            npm publish "$tarball" --access public --tag "$tag" --provenance
          done
          echo "==> publishing ${{ steps.tarballs.outputs.main }} (tag=$tag)"
          npm publish "${{ steps.tarballs.outputs.main }}" --access public --tag "$tag" --provenance
